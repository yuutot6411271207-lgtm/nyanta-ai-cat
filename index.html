<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐱 にゃんた</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#b9ecff,#e8d5ff 55%,#ffd7e8);color:#4b3b55}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#ffffffcc;border:3px solid #fff;border-radius:28px;padding:22px;box-shadow:0 12px 35px #7b5b8a33}h1{text-align:center;font-size:42px;margin:0 0 4px}.sub{text-align:center;margin:0 0 18px}.cat{font-size:130px;text-align:center;line-height:1.05}.msg{background:#fff;border-radius:18px;padding:12px 16px;text-align:center;margin:12px 0;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;padding:10px;border-radius:16px;text-align:center}.bar{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,#ff9ecb,#9edbff)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}button{border:0;border-radius:16px;padding:13px 8px;background:#fff;font-size:15px;font-weight:700;color:#4b3b55;box-shadow:0 4px 12px #6c4d7a22;cursor:pointer}button:active{transform:scale(.97)}#log{margin-top:16px;background:#fff;border-radius:18px;padding:12px;min-height:55px}footer{text-align:center;margin:16px 0 2px;font-size:13px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}.cat{font-size:105px}}
</style></head><body><div class="wrap"><main class="hero"><h1>🐱 にゃんた</h1><p class="sub">キミのそばにいるAIペット</p><div class="cat" id="cat">😺</div><div class="msg" id="msg">こんにちは！いっしょに遊ぼう♪</div><section class="stats"><div class="stat">❤️ なかよし<div id="loveText">50%</div><div class="bar"><div id="love" class="fill" style="width:50%"></div></div></div><div class="stat">😊 ごきげん<div id="moodText">80%</div><div class="bar"><div id="mood" class="fill" style="width:80%"></div></div></div><div class="stat">🍚 おなか<div id="foodText">60%</div><div class="bar"><div id="food" class="fill" style="width:60%"></div></div></div><div class="stat">⚡ 元気<div id="energyText">80%</div><div class="bar"><div id="energy" class="fill" style="width:80%"></div></div></div></section><div class="actions"><button onclick="feed()">🍚 餌やり</button><button onclick="play()">🎮 あそぶ</button><button onclick="pet()">🐾 なでる</button><button onclick="talk()">💬 会話</button><button onclick="adventure()">🗺️ 冒険</button><button onclick="save()">💾 セーブ</button><button onclick="quest()">🎁 クエスト</button><button onclick="resetGame()">🔄 リセット</button></div><div id="log">にゃんた：「今日は何する？」</div><footer>🐾 にゃんたといっしょに、最高の毎日を！</footer></main></div>
<script>
let s=JSON.parse(localStorage.getItem('nyanta'))||{love:50,mood:80,food:60,energy:80};function clamp(n){return Math.max(0,Math.min(100,n))}function render(){for(const k of ['love','mood','food','energy']){document.getElementById(k).style.width=s[k]+'%';document.getElementById(k+'Text').textContent=s[k]+'%'}localStorage.setItem('nyanta',JSON.stringify(s))}function say(t){document.getElementById('msg').textContent=t;document.getElementById('log').textContent='にゃんた：「'+t+'」';if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function feed(){s.food=clamp(s.food+25);s.love=clamp(s.love+5);s.mood=clamp(s.mood+4);say('あーん！もぐもぐ……おいしい！');document.getElementById('cat').textContent='😻';render()}function play(){s.energy=clamp(s.energy-10);s.mood=clamp(s.mood+12);s.love=clamp(s.love+7);say('遊ぶのたのしい！もう一回やろう♪');document.getElementById('cat').textContent='😸';render()}function pet(){s.love=clamp(s.love+8);s.mood=clamp(s.mood+5);say('ごろごろ……もっとなでて〜');document.getElementById('cat').textContent='🥰';render()}function talk(){const t=prompt('にゃんたに話しかけてね');if(!t)return;let r=t.includes('ごはん')?'ごはん！うれしい〜！':t.includes('遊')?'遊ぼう！':t.includes('おはよう')?'おはよう！今日もよろしくね♪':'にゃ〜！お話できてうれしいよ♪';s.love=clamp(s.love+3);say(r);render()}function adventure(){s.energy=clamp(s.energy-15);s.love=clamp(s.love+10);s.mood=clamp(s.mood+8);say('冒険に出発！きれいな宝石を見つけたよ✨');render()}function quest(){s.love=clamp(s.love+5);say('デイリークエスト達成！えらいにゃ〜🎉');render()}function save(){localStorage.setItem('nyanta',JSON.stringify(s));say('セーブしたよ！いつでも会えるにゃ♪')}function resetGame(){if(confirm('最初の状態に戻す？')){s={love:50,mood:80,food:60,energy:80};document.getElementById('cat').textContent='😺';say('また仲良くしようね！');render()}}render();
</script></body></html>
